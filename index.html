<script>
'use strict';
// Suppress multi-touch page zoom while preserving one-finger scrolling.
for(const type of ['gesturestart','gesturechange','gestureend']){
 document.addEventListener(type,e=>e.preventDefault(),{passive:false});
}
for(const type of ['touchstart','touchmove']){
 document.addEventListener(type,e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
}

const fields=['y','x','c','a','b'];
let values={y:'',x:'',c:'100',a:'',b:''},active='y',fresh=true,down=true,error='',editBase=null;
const STORAGE_KEY='kyowa-angle:state:v1:'+new URL('./',location.href).pathname;
function saveState(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,values,active,down,error}))}
 catch(e){console.warn('入力状態を端末に保存できませんでした。',e)}
}
function restoreState(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(!saved||saved.version!==1||!saved.values||typeof saved.down!=='boolean')return;
  const restored={};
  for(const k of fields){
   const v=saved.values[k];
   if(typeof v!=='string'||v.length>100||(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0)))return;
   restored[k]=v;
  }
  values=restored;down=saved.down;active=fields.includes(saved.active)?saved.active:'y';
  error=typeof saved.error==='string'&&saved.error.length<=160?saved.error:'';
  fresh=true;editBase=null;
 }catch(e){console.warn('保存された入力状態を読み込めませんでした。',e)}
}

const el=id=>document.getElementById(id);
const num=k=>values[k]===''?null:Number(values[k]);
const put=(k,n)=>{values[k]=Number.isFinite(n)?String(n):''};
const fmt=(v,d=0)=>v===''?'':Number(v).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
function select(k){if(active!==k){active=k;fresh=true}render()}
function calculate(k){
 error='';let n=num(k);
 if(n===null){if(k==='y'||k==='x'){values.y='';values.x='';values.a='';values.b=''}else if(k==='c'){values.a='';values.b=''}else if(k==='a'){values.b=''}else if(k==='b'){values.a=''}return}
 if(!Number.isFinite(n)||n<0||n>1e12||(k==='x'&&n>=90)||(['b','c'].includes(k)&&n===0)){
  error=k==='x'?'角度は0以上90未満で入力してください。':(['b','c'].includes(k)&&n===0)?'水平寸法と斜辺は0より大きい値を入力してください。':'入力できる範囲を超えています。';
  fields.forEach(f=>{if(f!==k&&f!=='c')values[f]=''});return;
 }
 let c=num('c'),a=num('a'),b=num('b'),r=num('y')===null?null:num('y')/100;
 if(c!==null&&c<=0){error='水平寸法は0より大きい値を入力してください。';if(k!=='a')values.a='';if(k!=='b')values.b='';return}
 if(k==='x'||k==='y'){
  r=k==='x'?Math.tan(n*Math.PI/180):n/100;
  if(k==='x')put('y',r*100);else put('x',Math.atan(r)*180/Math.PI);
  if(c!==null&&c>0){put('a',c*r);put('b',Math.hypot(c,c*r))}
 }else if(k==='c'){
  if(r!==null){put('a',c*r);put('b',Math.hypot(c,c*r))}
  else if(a!==null){put('y',a/c*100);put('x',Math.atan2(a,c)*180/Math.PI);put('b',Math.hypot(c,a))}
  else if(b!==null)solveSides(c,null,b);
 }else if(c!==null&&c>0){solveSides(c,k==='a'?a:null,k==='b'?b:null)}
 else if(r!==null){
  if(k==='a'&&r===0){values.c='';values.b='';error='勾配0では勾配幅から水平寸法を求められません。水平寸法を入力してください。';return}
  c=k==='a'?a/r:b/Math.hypot(1,r);
  if(c>0){put('c',c);put('a',c*r);put('b',Math.hypot(c,c*r))}
 }else if(a!==null&&b!==null){
  if(b<=a){error='斜辺は勾配幅より大きい値にしてください。';values.c='';values.y='';values.x='';return}
  solveSides(Math.sqrt((b-a)*(b+a)),a,b);
 }
}
function solveSides(c,a,b){
 if(a===null){if(b<c){error='斜辺は水平寸法以上の値にしてください。';values.a='';values.y='';values.x='';return}a=Math.sqrt((b-c)*(b+c))}
 put('c',c);put('a',a);put('b',Math.hypot(c,a));put('y',a/c*100);put('x',Math.atan2(a,c)*180/Math.PI);
}
function key(key){
 if(active==='y'&&key==='.')return;
 if(key==='AC'){values={y:'',x:'',c:'100',a:'',b:''};active='y';down=true;error='';fresh=true;editBase=null;render();return}
 if(key==='⏎'){active=fields[(fields.indexOf(active)+1)%fields.length];fresh=true;render();return}
 if(key==='C'){values[active]='';calculate(active);fresh=true;render();return}
 if(fresh||!editBase)editBase={...values};
 let s=fresh?'':values[active];
 if(key==='Backspace')s=s.slice(0,-1);
 else {if(key==='.'&&s.includes('.'))return;s+=key;if(s.startsWith('.'))s='0'+s;if(s.length>12)return}
 values={...editBase,[active]:s};fresh=false;calculate(active);values[active]=s;render();
}
function renderFullDiagram(){
 const y=num('y'),valid=y!==null&&!error,base=down?130:260,sign=down?1:-1;
 const h=valid?(y===0?0:Math.max(40,Math.min(140,y*2.9))):95,tip=base+sign*h;
 const text=(x,y,t,color='#f4f4f5',anchor='middle',size=22,maxWidth=140)=>`<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${color}" font-size="${size}" font-weight="700" stroke="#101012" stroke-width="5" stroke-linejoin="round" paint-order="stroke" ${String(t).length*size*.65>maxWidth?'textLength="'+maxWidth+'" lengthAdjust="spacingAndGlyphs"':''}>${t}</text>`;
 el('fullDiagram').innerHTML=`<path d="M70 ${base}V20 M8 ${base}H70" stroke="#0785ff" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round" fill="none"/>
 <g dominant-baseline="middle">${text(70,52,'A')}${text(35,base,'B')}</g>
 ${text(93,59,el('angleA').textContent,'#f4f4f5','start',24,115)}
 ${text(42,base+35,el('angleB').textContent,'#f4f4f5','middle',22,78)}
 <path d="M70 ${base}H360" stroke="#f97316" stroke-width="4" fill="none"/>
 ${text(235,base-sign*28,fmt(values.c)||'水平寸法','#fb923c')}
 <path d="M360 ${base}V${tip}" stroke="#22c55e" stroke-width="4" fill="none"/>
 ${text(360,tip+sign*32,valid?(fmt(values.a)||'—'):'勾配幅','#4ade80','middle',22,135)}
 <path d="M70 ${base}L360 ${tip}" stroke="#3b82f6" stroke-width="4" fill="none"/>
 ${text(225,(base+tip)/2+sign*32,valid?(fmt(values.b)||'—'):'斜辺','#60a5fa')}`;
 el('fullDiagram').setAttribute('aria-label',(down?'下向き':'上向き')+'の勾配図、A '+el('angleA').textContent+'、B '+el('angleB').textContent);
 el('fullDirection').textContent=down?'下向き ⇅':'上向き ⇅';
}
function fitInput(input,maxSize){
 const fieldLabel=input.id==='y'?el('slopePlaceholder'):input.id==='x'?el('angleFieldLabel'):null;
 if(fieldLabel)fieldLabel.hidden=false;
 const style=getComputedStyle(input),padding=parseFloat(style.paddingLeft)+parseFloat(style.paddingRight);
 let width=input.clientWidth-padding;
 if(width<=0)return;
 const canvas=fitInput.canvas||(fitInput.canvas=document.createElement('canvas')),context=canvas.getContext('2d');
 if(!context)return;
 context.font=style.fontWeight+' '+maxSize+'px '+style.fontFamily;
 const measured=context.measureText(input.value||'0').width;
 if(fieldLabel&&input.value!==''&&measured>width-4){
  fieldLabel.hidden=true;
  width=input.clientWidth-padding;
 }
 input.style.fontSize=Math.max(16,Math.min(maxSize,maxSize*(width-4)/Math.max(1,measured)))+'px';
}
window.addEventListener('resize',()=>{for(const k of fields)fitInput(el(k),k==='a'||k==='b'?28:k==='c'?26:23)});
function render(){
 el('c').style.color=num('c')===100?'#fb923c':'#ffffff';
 for(const k of fields){el(k).value=k===active&&!fresh?values[k]:fmt(values[k],k==='x'?1:0);fitInput(el(k),k==='a'||k==='b'?28:k==='c'?26:23)}
 document.querySelectorAll('[data-field]').forEach(n=>n.classList.toggle('active',n.dataset.field===active));el('error').textContent=error;
 el('direction').setAttribute('aria-pressed',String(down));el('direction').setAttribute('aria-label',down?'上向きに切り替え':'下向きに切り替え');el('directionLabel').textContent=down?'下向き ⇅':'上向き ⇅';
 el('directionIcon').innerHTML=`<path d="${down?'M12 17H70V47Z':'M12 42H70V12Z'}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><text x="40" y="${down?12:59}" text-anchor="middle" fill="currentColor" font-size="16" font-weight="bold">100</text><text x="78" y="${down?36:32}" fill="currentColor" font-size="16" font-weight="bold">y</text>`;
 el('slopePlaceholder').innerHTML=el('directionIcon').innerHTML;
 const y=num('y'),valid=y!==null&&!error,base=down?64:159,sign=down?1:-1,h=valid?(y===0?0:Math.max(15,Math.min(96,y))):65,tip=base+sign*h;
 const theta=num('x'),anglesValid=valid&&theta!==null&&Number.isFinite(theta)&&theta>=0&&theta<90;
 const angleText=n=>Number(n.toFixed(1)).toLocaleString('ja-JP',{maximumFractionDigits:1})+'°';
 el('angleA').textContent=anglesValid?angleText(90+(down?theta:-theta)):'—';
 el('angleB').textContent=anglesValid?angleText(180+(down?theta:-theta)):'—';
 const label=(x,y,t,color,anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${color}" font-size="18" ${String(t).length>9?'textLength="108" lengthAdjust="spacingAndGlyphs"':''} font-weight="bold">${t}</text>`;
 el('diagram').setAttribute('aria-label',(down?'下向き':'上向き')+'の勾配図');
 el('diagram').innerHTML=`<path d="M70 ${base}V18 M10 ${base}H70" stroke="#0785ff" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round" fill="none"/><g dominant-baseline="middle" stroke="#101012" stroke-width="7" stroke-linejoin="round" paint-order="stroke">${label(70,(base+18)/2,'A','#f4f4f5')}${label(40,base,'B','#f4f4f5')}</g><path d="M70 ${base}H270" stroke="#f97316" stroke-width="4" fill="none"/>${label(170,base-sign*27,fmt(values.c)||'水平寸法','#fb923c')}<path d="M270 ${base}V${tip}" stroke="#22c55e" stroke-width="4" fill="none"/>${label(282,(base+tip)/2+6,valid?(fmt(values.a)||'—'):'勾配幅','#4ade80','start')}<path d="M70 ${base}L270 ${tip}" stroke="#3b82f6" stroke-width="4" fill="none"/>${label(170,(base+tip)/2+(down?36+0.27*h:-(16+0.27*h)),valid?(fmt(values.b)||'—'):'斜辺','#60a5fa')}`;
 renderFullDiagram();
 saveState();
}
for(const [rowIndex,keys] of [['AC','.','00','0','⏎','C'],['1','2','3','4','5','6','7','8','9']].entries()){
 const row=document.createElement('div');row.className='key-row'+(rowIndex===1?' digits':'');
 for(const k of keys){
 const b=document.createElement('button');b.type='button';b.textContent=k;b.className=k==='⏎'?'enter':['AC','C'].includes(k)?'clear':'';if(k==='⏎')b.setAttribute('aria-label','次の入力欄へ');b.addEventListener('click',()=>key(String(k)));row.append(b);
 }
 document.querySelector('.keypad').append(row);
}
document.querySelectorAll('[data-field]').forEach(n=>{n.addEventListener('click',()=>select(n.dataset.field));n.querySelector('input').addEventListener('focus',()=>select(n.dataset.field))});
// Custom keypad: select the field without focusing the native text input.
el('c').addEventListener('pointerdown',e=>{e.preventDefault();select('c')});
el('direction').addEventListener('click',()=>{down=!down;render()});
document.addEventListener('keydown',e=>{if(el('fullView').open)return;if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.tagName==='BUTTON'&&['Enter',' '].includes(e.key))return;let k=e.key==='Enter'?'⏎':e.key==='Delete'?'C':e.key==='Escape'?'AC':e.key;if(/^[0-9.]$/.test(k)||['⏎','C','AC','Backspace'].includes(k)){e.preventDefault();key(k)}});
let savedScroll=0,previousBodyStyle='';
function openDiagram(){
 if(el('fullView').open)return;
 savedScroll=window.scrollY;previousBodyStyle=document.body.style.cssText;
 renderFullDiagram();el('fullView').showModal();
 document.body.style.position='fixed';document.body.style.top=-savedScroll+'px';document.body.style.width='100%';
 el('closeDiagram').focus({preventScroll:true});
}
el('openDiagram').addEventListener('click',openDiagram);
el('openDiagram').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();openDiagram()}});
el('closeDiagram').addEventListener('click',()=>el('fullView').close());
el('fullView').addEventListener('close',()=>{document.body.style.cssText=previousBodyStyle;window.scrollTo(0,savedScroll);el('openDiagram').focus({preventScroll:true})});
el('fullDirection').addEventListener('click',()=>{down=!down;render()});
restoreState();
render();
</script><script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
 let hadController=!!navigator.serviceWorker.controller, reloading=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(hadController&&!reloading){reloading=true;location.reload()}
  hadController=true;
 });
 window.addEventListener('load',async()=>{
  try {
   const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
   registration.update().catch(()=>{});
   document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')registration.update().catch(()=>{})});
  } catch(error){console.warn('PWA registration failed',error)}
 });
}
</script>
</body></html>
